<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1280" viewBox="0 0 2400 1280" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#315E46"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B6229"/>
    </marker>
  </defs>
  <rect width="2400" height="1280" fill="#F8F7F3"/>

  <!-- Columna 1: fuentes -->
  <text x="90" y="80" font-size="30" font-weight="600" fill="#7B6229" letter-spacing="3">NASA OPEN DATA</text>
  <g>
    <rect x="90" y="120" width="520" height="150" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="120" y="178" font-size="38" font-weight="600" fill="#1F2A24">NASA POWER</text>
    <text x="120" y="222" font-size="28" fill="#5C625C">15 seasons 2011-2025 · rain, ETo,</text>
    <text x="120" y="256" font-size="28" fill="#5C625C">min/max temperature · 0.5° grid</text>
  </g>
  <g>
    <rect x="90" y="300" width="520" height="150" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="120" y="358" font-size="38" font-weight="600" fill="#1F2A24">GPM IMERG</text>
    <text x="120" y="402" font-size="28" fill="#5C625C">Late daily: rain measured up to</text>
    <text x="120" y="436" font-size="28" fill="#5C625C">yesterday · Final: 15-year normal</text>
  </g>
  <g>
    <rect x="90" y="480" width="520" height="150" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="120" y="538" font-size="38" font-weight="600" fill="#1F2A24">GIBS / ASTER GDEM</text>
    <text x="120" y="582" font-size="28" fill="#5C625C">Terrain relief tiles, shipped</text>
    <text x="120" y="616" font-size="28" fill="#5C625C">inside the app for offline use</text>
  </g>
  <g>
    <rect x="90" y="660" width="520" height="120" rx="22" fill="#F2F0EA" stroke="#D9D6CC" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="120" y="716" font-size="34" font-weight="600" fill="#5C625C">Open-Meteo</text>
    <text x="120" y="754" font-size="26" fill="#5C625C">7-day forecast (non-NASA)</text>
  </g>

  <!-- Columna 2: servidor -->
  <path d="M625 345 L760 345" stroke="#315E46" stroke-width="5" marker-end="url(#a)"/>
  <rect x="780" y="120" width="620" height="660" rx="26" fill="#EAF0EA" stroke="#315E46" stroke-width="3"/>
  <text x="815" y="185" font-size="30" font-weight="600" fill="#315E46" letter-spacing="3">SERVER · ONCE A DAY</text>
  <text x="815" y="245" font-size="34" font-weight="600" fill="#1F2A24">1 · Clean</text>
  <text x="815" y="287" font-size="27" fill="#5C625C">Cut POWER at the last reliable</text>
  <text x="815" y="321" font-size="27" fill="#5C625C">month: GEOS-IT fill is wet-biased</text>
  <text x="815" y="385" font-size="34" font-weight="600" fill="#1F2A24">2 · Measure</text>
  <text x="815" y="427" font-size="27" fill="#5C625C">IMERG rain per zone: last 3, 7, 10,</text>
  <text x="815" y="461" font-size="27" fill="#5C625C">15, 30 days + start of the rains</text>
  <text x="815" y="525" font-size="34" font-weight="600" fill="#1F2A24">3 · Sign</text>
  <text x="815" y="567" font-size="27" fill="#5C625C">Season packs signed with</text>
  <text x="815" y="601" font-size="27" fill="#5C625C">ECDSA P-256 — tamper-proof</text>
  <text x="815" y="665" font-size="34" font-weight="600" fill="#1F2A24">4 · Publish</text>
  <text x="815" y="707" font-size="27" fill="#5C625C">One small JSON per zone (&lt;1 KB)</text>
  <text x="815" y="741" font-size="27" fill="#5C625C">for 23 cells covering Huánuco</text>

  <!-- Columna 3: telefono -->
  <path d="M1415 345 L1550 345" stroke="#315E46" stroke-width="5" marker-end="url(#a)"/>
  <text x="1482" y="300" font-size="24" fill="#315E46" text-anchor="middle">downloads</text>
  <text x="1482" y="332" font-size="24" fill="#315E46" text-anchor="middle">when there</text>
  <text x="1482" y="407" font-size="24" fill="#315E46" text-anchor="middle">is signal</text>
  <rect x="1570" y="120" width="740" height="660" rx="26" fill="#FFFFFF" stroke="#315E46" stroke-width="3"/>
  <text x="1605" y="185" font-size="30" font-weight="600" fill="#315E46" letter-spacing="3">PHONE · ALWAYS OFFLINE</text>
  <text x="1605" y="248" font-size="34" font-weight="600" fill="#1F2A24">Water balance, 10-day blocks</text>
  <text x="1605" y="292" font-size="27" fill="#5C625C">Effective rain (USDA SCS) → ETo (FAO-56),</text>
  <text x="1605" y="326" font-size="27" fill="#5C625C">corrected to the field altitude, −6.5 °C/km</text>
  <text x="1605" y="390" font-size="34" font-weight="600" fill="#1F2A24">Expected harvest, FAO-33</text>
  <text x="1605" y="434" font-size="27" fill="#5C625C">1 − Ky · (1 − ETa/ETc), averaged over the</text>
  <text x="1605" y="468" font-size="27" fill="#5C625C">15 seasons — the figure the farmer sees</text>
  <text x="1605" y="532" font-size="34" font-weight="600" fill="#1F2A24">Frost and altitude</text>
  <text x="1605" y="576" font-size="27" fill="#5C625C">Frost nights vs the crop's tolerance;</text>
  <text x="1605" y="610" font-size="27" fill="#5C625C">crops outside ±300 m are dropped</text>
  <text x="1605" y="674" font-size="34" font-weight="600" fill="#1F2A24">Rotation and decision</text>
  <text x="1605" y="718" font-size="27" fill="#5C625C">Andean wheel, 3 strategies compared;</text>
  <text x="1605" y="752" font-size="27" fill="#5C625C">sowing starts at 25 mm/10 days (Lodoun)</text>

  <!-- Salida -->
  <path d="M1940 800 L1940 880" stroke="#315E46" stroke-width="5" marker-end="url(#a)"/>
  <rect x="1330" y="900" width="980" height="140" rx="22" fill="#315E46"/>
  <text x="1370" y="963" font-size="35" font-weight="600" fill="#FFFFFF">One answer: plant this, this week, and why</text>
  <text x="1370" y="1008" font-size="27" fill="#CFE0D4">Spanish and Quechua · no account, no internet needed to decide</text>

  <!-- Flecha de retorno: por debajo de la banda, sin cruzarla -->
  <path d="M1300 970 L700 970 L700 830" stroke="#7B6229" stroke-width="5" fill="none" stroke-dasharray="14 10" marker-end="url(#b)"/>
  <text x="700" y="1030" font-size="26" fill="#7B6229">No signal: the phone keeps deciding</text>
  <text x="700" y="1064" font-size="26" fill="#7B6229">with the last data it saved</text>

  <!-- Pie -->
  <line x1="90" y1="1140" x2="2310" y2="1140" stroke="#D9D6CC" stroke-width="2"/>
  <text x="90" y="1200" font-size="27" fill="#5C625C">Heavy data work runs on the server once a day. The decision runs on the phone, so a farmer with no coverage still gets an answer.</text>
  <text x="90" y="1243" font-size="27" fill="#5C625C">Android (Kotlin/Compose) · decision engine in plain Java · Node.js server · 23 NASA grid cells over Huánuco, Peru</text>
</svg>
