<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1150" viewBox="0 0 2400 1150" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#315E46"/>
    </marker>
  </defs>
  <rect width="2400" height="1150" fill="#F8F7F3"/>
  <text x="90" y="80" font-size="30" font-weight="600" fill="#7B6229" letter-spacing="3">ONE FIELD, STEP BY STEP</text>
  <text x="90" y="140" font-size="34" fill="#5C625C">Beans · Huánuco, Peru · 1,900 m · rain-fed · NASA grid cell at 3,404 m</text>

  <g>
    <rect x="90" y="210" width="430" height="300" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="125" y="270" font-size="26" font-weight="600" fill="#7B6229">1 · RAIN</text>
    <text x="125" y="340" font-size="64" font-weight="600" fill="#1F2A24">73 mm</text>
    <text x="125" y="390" font-size="27" fill="#5C625C">measured in 30 days</text>
    <text x="125" y="428" font-size="27" fill="#5C625C">by GPM IMERG, to 14 Nov</text>
    <text x="125" y="478" font-size="27" fill="#315E46">normal for these dates: 72 mm</text>
  </g>
  <path d="M540 360 L600 360" stroke="#315E46" stroke-width="5" marker-end="url(#a)"/>

  <g>
    <rect x="620" y="210" width="430" height="300" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="655" y="270" font-size="26" font-weight="600" fill="#7B6229">2 · WHAT THE SOIL KEEPS</text>
    <text x="655" y="332" font-size="30" fill="#1F2A24">Effective rain, USDA SCS</text>
    <text x="655" y="374" font-size="27" fill="#5C625C">Pe = P(125 − 0.2P)/125</text>
    <text x="655" y="424" font-size="30" fill="#1F2A24">Demand, FAO-56</text>
    <text x="655" y="466" font-size="27" fill="#5C625C">ETc = Kc × ETo, corrected</text>
    <text x="655" y="500" font-size="27" fill="#5C625C">to 1,900 m at −6.5 °C/km</text>
  </g>
  <path d="M1070 360 L1130 360" stroke="#315E46" stroke-width="5" marker-end="url(#a)"/>

  <g>
    <rect x="1150" y="210" width="430" height="300" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="1185" y="270" font-size="26" font-weight="600" fill="#7B6229">3 · WATER GAP</text>
    <text x="1185" y="340" font-size="64" font-weight="600" fill="#1F2A24">79 %</text>
    <text x="1185" y="390" font-size="27" fill="#5C625C">of the water the crop asks</text>
    <text x="1185" y="440" font-size="27" fill="#315E46">66 mm short of 309 mm</text>
    <text x="1185" y="482" font-size="27" fill="#5C625C">over the whole cycle</text>
  </g>
  <path d="M1600 360 L1660 360" stroke="#315E46" stroke-width="5" marker-end="url(#a)"/>

  <g>
    <rect x="1680" y="210" width="630" height="300" rx="22" fill="#EAF0EA" stroke="#315E46" stroke-width="3"/>
    <text x="1715" y="270" font-size="26" font-weight="600" fill="#315E46">4 · EXPECTED HARVEST · FAO-33</text>
    <text x="1715" y="350" font-size="64" font-weight="600" fill="#315E46">76 %</text>
    <text x="1715" y="402" font-size="29" fill="#1F2A24">1 − Ky · (1 − ETa/ETc), Ky = 1.15</text>
    <text x="1715" y="446" font-size="27" fill="#5C625C">averaged over 15 seasons, not one year</text>
    <text x="1715" y="488" font-size="27" fill="#5C625C">Frost: 0 nights in 100, tolerance 8</text>
  </g>

  <line x1="90" y1="580" x2="2310" y2="580" stroke="#D9D6CC" stroke-width="2"/>

  <text x="90" y="660" font-size="30" font-weight="600" fill="#7B6229" letter-spacing="3">THE SAME MATHS SEPARATES PLACES</text>
  <text x="90" y="712" font-size="30" fill="#5C625C">When the rains of this season actually started, measured per NASA cell:</text>

  <g>
    <rect x="90" y="760" width="700" height="190" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="125" y="818" font-size="30" font-weight="600" fill="#1F2A24">Lowland forest · 212 m</text>
    <text x="125" y="878" font-size="44" font-weight="600" fill="#315E46">10 September</text>
    <text x="125" y="922" font-size="26" fill="#5C625C">rains well under way</text>
  </g>
  <g>
    <rect x="850" y="760" width="700" height="190" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="885" y="818" font-size="30" font-weight="600" fill="#1F2A24">Valley · 1,900 m (this field)</text>
    <text x="885" y="878" font-size="44" font-weight="600" fill="#315E46">25 October</text>
    <text x="885" y="922" font-size="26" fill="#5C625C">sowing window open now</text>
  </g>
  <g>
    <rect x="1610" y="760" width="700" height="190" rx="22" fill="#FFFFFF" stroke="#D9D6CC" stroke-width="2"/>
    <text x="1645" y="818" font-size="30" font-weight="600" fill="#1F2A24">High puna · 3,879 m</text>
    <text x="1645" y="878" font-size="44" font-weight="600" fill="#9A5148">not yet</text>
    <text x="1645" y="922" font-size="26" fill="#5C625C">the app says: wait</text>
  </g>

  <text x="90" y="1035" font-size="27" fill="#5C625C">Onset rule: 25 mm over 10 days with no 7-day dry spell in the following 30 (Lodoun et al., 2013). Water: FAO-56 and FAO-33; effective rain: USDA SCS.</text>
  <text x="90" y="1078" font-size="27" fill="#5C625C">Still to validate with INIA agronomists: crop coefficients, altitude ranges and sowing months are FAO/INIA reference values, not measured in Huánuco.</text>
</svg>
