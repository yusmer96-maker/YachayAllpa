apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// La firma de release se lee de un fichero FUERA del repositorio, indicado por
// YACHAY_SIGNING_PROPERTIES. Sin ese fichero, assembleRelease sale sin firmar y
// assembleDebug sigue funcionando igual: el repositorio no guarda ninguna clave.
def firmaProps = new Properties()
def firmaRuta = System.getenv('YACHAY_SIGNING_PROPERTIES')
if (firmaRuta && file(firmaRuta).exists()) {
    file(firmaRuta).withInputStream { firmaProps.load(it) }
}

android {
    namespace 'pe.yachayallpa.app'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'pe.yachayallpa.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions { jvmTarget = '11' }
    buildFeatures { compose true }
    signingConfigs {
        release {
            if (firmaProps['storeFile']) {
                storeFile file(firmaProps['storeFile'])
                storePassword firmaProps['storePassword']
                keyAlias firmaProps['keyAlias']
                keyPassword firmaProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Sin ofuscar: el jurado debe poder leer y reproducir el codigo.
            minifyEnabled false
            signingConfig firmaProps['storeFile'] ? signingConfigs.release : null
        }
    }
}
dependencies {
    implementation project(':core')
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
}
